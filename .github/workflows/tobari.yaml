name: Tobari

on:
  push:
    branches:
      - main
    paths:
      - "**.go"
      - "go.mod"
      - "aqua.yaml"
      - "taskfile.yaml"
      - ".github/workflows/tobari.yaml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "aqua.yaml"
      - "taskfile.yaml"
      - ".github/workflows/tobari.yaml"
  workflow_dispatch:

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup tobari
        uses: goccy/tobari-action/setup@76a7fd11fada4de8bc0a2a1d749f2ba3689ba623 # v1.3.0
        with:
          version: v0.13.0

      - name: Run tests with tobari
        run: |
          GOFLAGS="$(tobari flags)" go test -count=1 ./...
          tobari merge json -o tobari/tobari.json $(find . -name tobari.json -path "*/tobari/tobari.json" -not -path "./tobari/*" -not -path "./integration/s3-test/s3-tests/*" | sort)
          rm -f tobari/tobari.toon

      - name: Report coverage
        uses: goccy/tobari-action/report@76a7fd11fada4de8bc0a2a1d749f2ba3689ba623 # v1.3.0
